# === Qwen-Image-Edit (vlm_only) + LoHa, lr=1e-4, only 1328 ===
# Same base/schedule as the LoKr experiments, but network algo = LoHa.
# LoHa uses a real rank (network_dim) + alpha, NOT `factor` (that is LoKr-only).
#
# Run (4 GPUs):
#   accelerate launch --num_cpu_threads_per_process 1 --mixed_precision bf16 \
#     --multi_gpu --num_processes 4 \
#     src/musubi_tuner/qwen_image_train_network.py \
#     --config_file _train/exp/5.without_vae_loha_lr_1e-4_1328/config

# --- models ---
dit          = "_train/models/qwen_image_2512_bf16.safetensors"
vae          = "_train/models/qwen_image_vae.safetensors"
text_encoder = "_train/models/qwen_2.5_vl_7b.safetensors"
model_version = "edit-2509"
vlm_only_edit = true            # without_vae branch: VLM conditioning only, no control VAE latents in DiT

# --- data (only 1328) ---
dataset_config = "_train/exp/5.without_vae_loha_lr_1e-4_1328/dataset_config.toml"

# --- network: LyCORIS / LoHa ---
# Layer selection is done ONLY via the preset; inline target_name in network_args is
# ignored by lycoris.kohya (it reads only `preset`, `algo`, `network_dim`/`alpha`, ...).
# network_dim = LoHa rank, network_alpha = scaling alpha (tune as needed).
network_module = "lycoris.kohya"
network_dim    = 16
network_alpha  = 16
network_args = [
  "preset=_train/exp/5.without_vae_loha_lr_1e-4_1328/loha_preset.toml",
  "algo=loha",
]

# --- optimizer / LR (lr=1e-4) ---
learning_rate             = 1e-4
optimizer_type            = "adamw8bit"
lr_scheduler              = "linear"
lr_scheduler_min_lr_ratio = 1e-5
lr_warmup_steps           = 150

# --- diffusion / timesteps (from civitai) ---
timestep_sampling = "qinglong_qwen"
weighting_scheme  = "none"
# discrete_flow_shift intentionally unset: qinglong_qwen sets the shift dynamically.

# --- precision / attention ---
mixed_precision = "bf16"
sdpa            = true
seed            = 42

# Memory: not needed on H200. Enable if you hit OOM:
# gradient_checkpointing = true
# gradient_checkpointing_cpu_offload = true
# blocks_to_swap = 25
gradient_accumulation_steps = 8

# --- data loader ---
max_data_loader_n_workers      = 5
persistent_data_loader_workers = true

# --- schedule / save ---
max_train_epochs   = 50
save_every_n_steps = 500
save_state = true
save_state_on_train_end = true
save_last_n_steps_state = 2

# --- output ---
output_dir  = "_train/exp/5.without_vae_loha_lr_1e-4_1328/output"
output_name = "qwen_edit_vlm_only_loha_lr1e-4_1328"
logging_dir = "_train/exp/5.without_vae_loha_lr_1e-4_1328/logs"
