# === Qwen-Image (text2image, original) + LoKr, lr=1e-4 cosine->1e-5, 1328 + 640 ===
# Standard TEXT-TO-IMAGE fine-tune of Qwen-Image (qwen_image_2512). NO image conditioning:
#   - model_version = "original" (NOT edit-2509)
#   - no vlm_only_edit, no control/reference images anywhere
# Best-result hyperparameters: lr=1e-4 decaying to 1e-5 via cosine_with_min_lr over 20k steps,
# warmup=200, LoKr factor=8, multi-resolution 1328 + 640.
#
# NOTE on naming: "without_vae" here is legacy from the edit experiments (no control VAE
# latents). In pure t2i there are simply no control latents at all. VAE is STILL required
# (target latents + sampling).
#
# Run (4 GPUs):
#   accelerate launch --num_cpu_threads_per_process 1 --mixed_precision bf16 \
#     --multi_gpu --num_processes 4 \
#     src/musubi_tuner/qwen_image_train_network.py \
#     --config_file _train/exp/12.without_vae_lork_lr_1e-4_1328_640/config
#
# Pre-cache FIRST in ORIGINAL (t2i) mode. The existing cache_qwen_image_reference_* dirs are
# for Edit (control latents + image-aware TE embeds) and are NOT reusable here:
#   python src/musubi_tuner/qwen_image_cache_latents.py \
#     --dataset_config _train/exp/12.without_vae_lork_lr_1e-4_1328_640/dataset_config.toml \
#     --vae _train/models/qwen_image_vae.safetensors --model_version original
#   python src/musubi_tuner/qwen_image_cache_text_encoder_outputs.py \
#     --dataset_config _train/exp/12.without_vae_lork_lr_1e-4_1328_640/dataset_config.toml \
#     --text_encoder _train/models/qwen_2.5_vl_7b.safetensors --batch_size 1 --model_version original

# --- models ---
dit          = "_train/models/qwen_image_2512_bf16.safetensors"
vae          = "_train/models/qwen_image_vae.safetensors"
text_encoder = "_train/models/qwen_2.5_vl_7b.safetensors"
model_version = "original"      # standard text2image; no edit / no image conditioning

# --- data (1328 + 640, text2image: image + caption only) ---
dataset_config = "_train/exp/12.without_vae_lork_lr_1e-4_1328_640/dataset_config.toml"

# --- network: LyCORIS / LoKr, factor=8 ---
# Layer selection is done ONLY via the preset (lycoris.kohya reads preset/algo/factor/...).
network_module = "lycoris.kohya"
network_dim    = 1000000000     # full-matrix LoKr: effective size set by `factor`, not dim
network_args = [
  "preset=_train/exp/12.without_vae_lork_lr_1e-4_1328_640/lokr_preset.toml",
  "algo=lokr",
  "factor=8",
  "bypass_mode=False",
]

# --- optimizer / LR: 1e-4 -> 1e-5 via cosine_with_min_lr over 20k steps, warmup 200 ---
learning_rate             = 2e-4
optimizer_type            = "adamw8bit"
max_grad_norm             = 1.0
lr_scheduler              = "cosine_with_min_lr"   # respects the min-lr floor (plain "cosine" ignores it)
lr_scheduler_min_lr_ratio = 0.1                    # floor = learning_rate * 0.1 = 1e-5
lr_warmup_steps           = 500
# The cosine horizon == max_train_steps, so LR reaches the 1e-5 floor exactly at 20k steps.

# --- diffusion / timesteps (tuned sampler; sets the shift dynamically) ---
timestep_sampling = "qinglong_qwen"
weighting_scheme  = "none"
# discrete_flow_shift intentionally unset: qinglong_qwen sets the shift dynamically.

# --- precision / attention ---
mixed_precision = "bf16"
sdpa            = true
seed            = 42

# Memory: not needed on H200. Enable if you hit OOM:
# gradient_checkpointing = true
# gradient_checkpointing_cpu_offload = true
# blocks_to_swap = 25
gradient_accumulation_steps = 8

# --- data loader ---
max_data_loader_n_workers      = 5
persistent_data_loader_workers = true

# --- schedule / save ---
max_train_steps    = 30000      # also defines the cosine_with_min_lr decay horizon (1e-4 -> 1e-5)
# max_train_epochs = 50         # unused: max_train_steps drives both the stop point and the LR horizon
save_every_n_steps = 500
save_state = true
save_state_on_train_end = true
save_last_n_steps_state = 2

# --- output ---
output_dir  = "_train/exp/12.without_vae_lork_lr_1e-4_1328_640/output"
output_name = "qwen_image_t2i_lokr_f8_lr1e-4_1328_640"
logging_dir = "_train/exp/12.without_vae_lork_lr_1e-4_1328_640/logs"
